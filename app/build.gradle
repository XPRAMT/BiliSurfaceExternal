plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xpramt.bilisurfacebridge'
    compileSdk 35
    ndkVersion '28.0.12674087'

    defaultConfig {
        applicationId 'dev.xpramt.bilisurfacebridge'
        minSdk 24
        targetSdk 35
        versionCode 107
        versionName '0.9.69'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
