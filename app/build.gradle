plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xpramt.bilisurfacebridge'
    compileSdk 35
    ndkVersion '28.0.12674087'

    defaultConfig {
        applicationId 'dev.xpramt.bilisurfacebridge'
        minSdk 24
        targetSdk 35
        versionCode 108
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    // Release signing comes from a properties file outside the repository
    // (storeFile/storePassword/keyAlias/keyPassword); default
    // ~/.android/bilisurfacebridge-release.properties, or -PreleaseSigningProperties=<path>.
    // Without it the release APK is built unsigned.
    def signingPropertiesFile = file(project.findProperty('releaseSigningProperties')
            ?: "${System.getProperty('user.home')}/.android/bilisurfacebridge-release.properties")
    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                def signing = new Properties()
                signingPropertiesFile.withInputStream { signing.load(it) }
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPropertiesFile.isFile()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
}
